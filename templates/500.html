{% extends "base.html" %}
{% block title %}500 — Server Error{% endblock %}
{% block content %}
<section class="error-section">
  <div class="error-inner">
    <div class="error-code">500</div>
    <h1 class="error-title">Internal Server Error</h1>
    <p class="error-desc">Something went wrong on our end. No sensitive information has been exposed. Please try again later.</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary" id="error500HomeBtn">Go Home</a>
  </div>
</section>
{% endblock %}
