{% extends "base.html" %}
{% block title %}Sign In{% endblock %}
{% block meta_desc %}Sign in to the SecureApp demo application.{% endblock %}

{% block content %}
<section class="auth-section">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon">&#x1F511;</div>
      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-subtitle">Sign in to your account</p>
    </div>
    <form class="auth-form" method="POST" action="{{ url_for('login') }}" id="loginForm">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label for="username" class="form-label">Username</label>
        <input type="text" id="username" name="username" class="form-input"
               autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <div class="input-with-toggle">
          <input type="password" id="password" name="password" class="form-input"
                 autocomplete="current-password" required>
          <button type="button" class="toggle-password" aria-label="Toggle password visibility" data-target="password">&#x1F441;</button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-full" id="loginSubmit">Sign In</button>
    </form>
    <div class="auth-footer">Don't have an account? <a href="{{ url_for('register') }}" id="goToRegisterLink">Register</a></div>
  </div>
</section>
{% endblock %}
